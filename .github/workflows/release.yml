name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant to produce'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both
      prerelease:
        description: 'Mark this release as a pre-release'
        required: false
        default: false
        type: boolean
      release_title:
        description: 'Custom release title (defaults to tag or commit)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK(s)
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "Selected build type: $BUILD_TYPE"

          if [ "$BUILD_TYPE" = "debug" ]; then
            bash ./gradlew --no-daemon assembleDebug
          elif [ "$BUILD_TYPE" = "release" ]; then
            bash ./gradlew --no-daemon assembleRelease
          else
            bash ./gradlew --no-daemon assembleDebug assembleRelease
          fi

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${{ github.ref_name }}"
          [ -z "$TAG_NAME" ] && TAG_NAME="manual-${{ github.sha }}"

          # Copy debug APK if present
          if compgen -G "app/build/outputs/apk/debug/*.apk" > /dev/null; then
            for f in app/build/outputs/apk/debug/*.apk; do
              cp "$f" "release-artifacts/emre-gallery-${TAG_NAME}-debug.apk"
            done
          fi

          # Copy release APK if present
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            for f in app/build/outputs/apk/release/*.apk; do
              cp "$f" "release-artifacts/emre-gallery-${TAG_NAME}-release-unsigned.apk"
            done
          fi

          # Generate SHA-256 Checksums
          cd release-artifacts
          sha256sum *.apk > checksums.txt 2>/dev/null || true
          cd ..

          ls -la release-artifacts/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-${{ github.sha }}
          path: release-artifacts/*
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.event.inputs.release_title || github.ref_name }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: release-artifacts/*
          generate_release_notes: true
